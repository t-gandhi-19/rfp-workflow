[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rfp-workflow"
version = "0.1.0"
description = "Agentic RFP response workflow — cloud migration domain, synthetic data only"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }

# Phase 1 dependency set only. Later phases add their own (Phase 2: neo4j,
# pdfplumber, python-docx, pytesseract; Phase 4: crewai, opentelemetry, openlit;
# Phase 6: streamlit). Keeping this lean keeps CI and image builds fast.
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0.36,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.14,<2",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<8",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-pyyaml>=6.0",
    "asgi-lifespan>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
# `src` is itself the package root, so every module is imported as
# `src.contracts...`, `src.gateway...`. This keeps the paths in CLAUDE.md and
# the build prompt (§3) literally true, and makes the CI import guard
# ("no provider SDKs outside src/gateway/") an exact path check.
packages = ["src"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print — no stray print() in library code
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
]
ignore = [
    "S104",  # binding 0.0.0.0 is intended inside containers
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is the point of a test
    "S105",  # hardcoded "passwords" in tests are fixtures
    "S106",
]
"src/evals/**" = ["T20"]   # the harness prints its report summary
"alembic/**" = ["ALL"]     # generated migration scaffolding

# ---------------------------------------------------------------------------
# mypy — strict on contracts and graph (CLAUDE.md code standards)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# `strict` is not a per-module option, so the strict flag set is spelled out.
module = ["src.contracts.*", "src.graph.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true

[[tool.mypy.overrides]]
# Test helpers may take loosely-typed kwargs to build invalid payloads on
# purpose; the tests themselves are still fully annotated.
module = ["tests.*"]
disallow_any_generics = false
warn_return_any = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires the docker compose stack to be running",
]
