# The embedding model and the vector index are ONE decision, so they are written
# down in one place.
#
# Neo4j's vector index is created with a fixed dimension. Change the model to one
# with a different width and every existing embedding becomes unindexable; change
# it to one of the same width and the vectors are silently incomparable, which is
# worse because nothing errors — retrieval just quietly gets bad.
#
# So: `make preflight` asserts the pinned tag is the model actually installed and
# that it really returns `dimensions` values, `make ingest` refuses to run until
# that passes, and `make reembed` exists for when this file legitimately changes.
version: 1

model:
  # The gateway alias application code names. Never a raw model name in Python.
  alias: embed-model
  # The concrete Ollama tag the alias must resolve to. Must match the
  # `embed-model` entry in docker/litellm/config.yaml.
  tag: nomic-embed-text:v1.5
  # Asserted by a real probe embedding in preflight, not assumed from docs.
  dimensions: 768

  # nomic-embed-text is TRAINED WITH TASK PREFIXES. Sending raw text degrades
  # retrieval: similarity compresses into a narrow band and topic discrimination
  # weakens. That is not a theory — it is what was measured here before these
  # were applied (cosine 0.649-1.0, mean 0.716; Recall@5 0.333; unanswerable
  # questions matching). Stored corpus text uses the document prefix; an
  # incoming question uses the query prefix, and the two are NOT
  # interchangeable.
  #
  # Applied inside the embedding path from this config, never by callers.
  # Changing either value invalidates every stored vector: run `make reembed`.
  task_prefixes:
    document: "search_document: "
    query: "search_query: "

index:
  name: question_embedding
  label: Question
  property: embedding
  similarity: cosine

# Printed verbatim by preflight when the model is missing, so the fix needs no
# interpretation.
install_command: ollama pull nomic-embed-text:v1.5
