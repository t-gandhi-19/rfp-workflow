name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Secret scanning gates the merge (CLAUDE.md rule 16).
  # ---------------------------------------------------------------------------
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Lint and types. mypy is strict on contracts/ and graph/.
  # ---------------------------------------------------------------------------
  quality:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --group dev
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy src tests

  # ---------------------------------------------------------------------------
  # Unit and security suites. No network, no models, no database.
  # ---------------------------------------------------------------------------
  tests:
    name: unit + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --group dev
      - name: Unit tests — contracts, validators, fixtures, extraction
        run: uv run pytest tests/unit -q
      - name: Security tests — submitter, SQL interpolation, provider SDKs
        run: uv run pytest tests/security -q
      - name: Fixtures match a fresh generation
        run: uv run python -m scripts.generate_fixtures --check

  # ---------------------------------------------------------------------------
  # Live stack: real Keycloak, real Postgres, real Neo4j, real write-api.
  #
  # Neo4j joins the list this phase — the graph queries and the vector index
  # earn its startup cost now. Langfuse and LiteLLM stay out until the phase
  # that uses them.
  #
  # Ollama is never started in CI (CLAUDE.md rule 26), so ingest runs with
  # RFP_FAKE_EMBEDDINGS=1. Those vectors exercise the plumbing — ingest, the
  # index, query shape, idempotency — and say nothing about retrieval quality,
  # which is measured against real embeddings in Phase 3.
  # ---------------------------------------------------------------------------
  smoke:
    name: compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --group dev

      - name: Prepare .env
        run: |
          cp .env.example .env
          # No model is called in this job; a placeholder keeps LiteLLM's config
          # parseable if it is ever added to the service list here.
          sed -i 's|^GROQ_API_KEY=$|GROQ_API_KEY=gsk-ci-placeholder|' .env

      - name: Start postgres, keycloak, neo4j, write-api
        run: |
          set -a && source .env && set +a
          docker compose --profile infra --profile app up -d --wait \
            postgres keycloak neo4j write-api

      - name: Show service status
        if: always()
        run: docker compose --profile infra --profile app ps

      # THROUGH THE MAKE TARGET, not `python -m scripts.apply_schema`.
      #
      # The recipe is a layer nothing used to execute. `make preflight` shipped
      # without HOST_NEO4J and dialled the compose service name from the host,
      # and neither the unit suite nor this job noticed — because this job
      # invoked the modules directly with its own NEO4J_URI export, supplying by
      # hand exactly what the broken recipe failed to supply. Running the target
      # means the wiring is exercised rather than bypassed.
      #
      # No NEO4J_URI export here on purpose: HOST_NEO4J is what must provide it.
      # Re-adding one would restore the blind spot.
      - name: Apply graph schema through its make target (twice — it must be idempotent)
        run: |
          set -a && source .env && set +a
          make apply-schema
          make apply-schema

      # CI COMMISSIONS ITS OWN GUARD BASELINES (amendment N).
      #
      # The baselines in config/scoring.yaml were measured against
      # nomic-embed-text on real vectors. They describe that model, so CI must
      # neither be judged against them nor be able to move them. `calibrate`
      # refuses the second outright: commissioning under the stand-in is allowed
      # only when RFP_CONFIG_DIR points somewhere other than the committed
      # config, so nothing that ships can change here.
      #
      # Commissioned once per run, from CI's own vectors, and the enforcing
      # calibration below is then judged against those. Deterministic by
      # construction — the stand-in is a pure function of the fixtures — so this
      # is a fixed comparison, not a ratchet that resets itself.
      # THROUGH THE MAKE TARGETS: apply-schema, ingest and calibrate all run
      # from their real recipes. `-o preflight-pre-ingest` marks only that
      # prerequisite old — its checks need Ollama, which CI never runs
      # (CLAUDE.md rule 26). Everything else in the chain executes.
      #
      # ORDER MATTERS SINCE AMENDMENT S. Commissioning used to run before this
      # step; it cannot any more, because calibration now compares its own
      # similarity against the VECTOR INDEX, and before ingest the index is
      # empty. So the graph is populated first, judged against the shipped
      # baselines (which the stand-in clears comfortably — its separation is
      # ~0.93 against a body_min of 0.1394), and CI's own baselines are
      # commissioned and enforced immediately afterwards.
      - name: Ingest and calibrate through the make targets
        run: |
          set -a && source .env && set +a
          export RFP_FAKE_EMBEDDINGS=1
          export RFP_CONFIG_DIR="$RUNNER_TEMP/ci-config"
          cp -r config "$RFP_CONFIG_DIR"
          make -o preflight-pre-ingest ingest

      # CI COMMISSIONS ITS OWN GUARD BASELINES (amendment N).
      #
      # The baselines in config/scoring.yaml were measured against
      # nomic-embed-text on real vectors. They describe that model, so CI must
      # neither be judged against them nor be able to move them. `calibrate`
      # refuses the second outright: commissioning under the stand-in is allowed
      # only when RFP_CONFIG_DIR points somewhere other than the committed
      # config, so nothing that ships can change here.
      #
      # Commissioned once per run, from CI's own vectors. Deterministic by
      # construction — the stand-in is a pure function of the fixtures — so this
      # is a fixed comparison, not a ratchet that resets itself.
      - name: Commission CI's own calibration baselines into a scratch config
        run: |
          set -a && source .env && set +a
          export RFP_FAKE_EMBEDDINGS=1
          export RFP_CONFIG_DIR="$RUNNER_TEMP/ci-config"
          export NEO4J_URI=bolt://localhost:${NEO4J_BOLT_PORT_HOST:-7687}
          uv run python -m scripts.calibrate --commission --dry-run --skip-persist

      # The run of record: BOTH TIERS ENFORCING against the baselines CI just
      # measured on its own vectors, with no exemption — tier 1 on the median
      # gap, tier 2 landing all twenty golden questions on the derived floor,
      # plus the amendment-S units agreement between calibration and the index.
      # Under v2 this was impossible: the stand-in's separation was negative and
      # `make calibrate` refused, so the guards were the one thing CI could not
      # exercise.
      - name: Calibrate enforcing against CI's own baselines
        run: |
          set -a && source .env && set +a
          export RFP_FAKE_EMBEDDINGS=1
          export RFP_CONFIG_DIR="$RUNNER_TEMP/ci-config"
          make calibrate

      - name: Ingest is idempotent
        run: |
          set -a && source .env && set +a
          export NEO4J_URI=bolt://localhost:${NEO4J_BOLT_PORT_HOST:-7687}
          export RFP_FAKE_EMBEDDINGS=1
          # Invoked directly rather than through `make ingest`: this compares two
          # runs' JSON on stdout, and the make target also runs calibrate, whose
          # report is not JSON. The recipe is exercised by the step above; what
          # this adds is the comparison.
          uv run python -m scripts.ingest > /tmp/ingest-first.json
          uv run python -m scripts.ingest > /tmp/ingest-second.json
          python - <<'PY'
          import json
          first = json.load(open("/tmp/ingest-first.json"))
          second = json.load(open("/tmp/ingest-second.json"))
          for key in ("nodes", "relationships", "by_label", "by_relationship"):
              assert first[key] == second[key], f"ingest is not idempotent: {key} changed"
          assert first["nodes"] > 0, "the graph is empty; the ingest above did not land"
          assert second["questions_embedded"] == 0, "re-ingest re-embedded existing questions"
          print(f"ingest idempotent: {first['nodes']} nodes, {first['relationships']} relationships")
          PY

      - name: Integration tests
        run: |
          set -a && source .env && set +a
          export KEYCLOAK_BASE=http://localhost:${KEYCLOAK_PORT_HOST:-8080}
          export WRITE_API_BASE=http://localhost:${WRITE_API_PORT:-8001}
          export NEO4J_URI=bolt://localhost:${NEO4J_BOLT_PORT_HOST:-7687}
          uv run pytest tests/integration -q -m integration

      - name: Confirm the write actually landed in Postgres
        run: |
          set -a && source .env && set +a
          count=$(docker compose exec -T postgres \
            psql -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" -tAc \
            "SELECT count(*) FROM runs WHERE run_id = 'run-integration-001';")
          test "$count" = "1" || { echo "expected 1 run row, found '$count'"; exit 1; }

      - name: Confirm app_writer cannot DELETE
        run: |
          set -a && source .env && set +a
          # Least privilege is asserted, not assumed: this must fail. -h forces
          # a password-authenticated TCP connection rather than socket trust.
          if docker compose exec -T -e PGPASSWORD="$APP_WRITER_PASSWORD" postgres \
              psql -U app_writer -h 127.0.0.1 -d "$POSTGRES_DB" \
              -c "DELETE FROM runs;" 2>/dev/null; then
            echo "app_writer was able to DELETE — least privilege is broken"
            exit 1
          fi
          echo "app_writer correctly denied DELETE"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile infra --profile app logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose --profile infra --profile app down -v
