# rfp-workflow local stack.
#
#   make up          infra + app
#   make up-infra    infra only
#   make nuke        stop everything and delete every named volume
#
# Ollama is deliberately NOT here. It runs on the host so it can use the host's
# GPU where one exists (CLAUDE.md rule 26); containers reach it at
# host.docker.internal:11434. CI never touches it — the gateway is mocked there.
#
# Postgres hosts three databases: `rfp` (this project), `keycloak`, and
# `langfuse`. Co-tenancy rather than three containers keeps the stack inside the
# resource budget of one developer machine, and each has its own role.
#
# Every service has a healthcheck, and every app service waits on
# `condition: service_healthy`. A container that is running but not yet ready is
# the single most common cause of a flaky first-run experience.

name: rfp-workflow

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Data plane
  # ---------------------------------------------------------------------------
  postgres:
    <<: *restart
    image: postgres:17.2-alpine
    profiles: [infra]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rfp}
      RFP_MIGRATOR_PASSWORD: ${RFP_MIGRATOR_PASSWORD:?set RFP_MIGRATOR_PASSWORD in .env}
      APP_WRITER_PASSWORD: ${APP_WRITER_PASSWORD:?set APP_WRITER_PASSWORD in .env}
      APP_READER_PASSWORD: ${APP_READER_PASSWORD:?set APP_READER_PASSWORD in .env}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory. `make nuke` makes it run again.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Host ports are configurable so this stack can coexist with another one
      # already using the conventional ports. Defaults are the conventional
      # ones; override in .env only if something clashes.
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-rfp}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    <<: *restart
    image: neo4j:5.26-community
    profiles: [infra]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    ports:
      - "${NEO4J_HTTP_PORT_HOST:-7474}:7474"
      - "${NEO4J_BOLT_PORT_HOST:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------------
  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.4
    profiles: [infra]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # `iss` in every token. Must match KEYCLOAK_ISSUER exactly or every
      # request is rejected — see README "Issuer and audience".
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-rfp.json:/opt/keycloak/data/import/realm-rfp.json:ro
    ports:
      - "${KEYCLOAK_PORT_HOST:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image ships no curl or wget, so this speaks HTTP over
      # bash's /dev/tcp against the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  # ---------------------------------------------------------------------------
  # LLM gateway — the only egress to models
  # ---------------------------------------------------------------------------
  litellm:
    <<: *restart
    image: ghcr.io/berriai/litellm:v1.72.0-stable
    profiles: [infra]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT_HOST:-4000}:4000"
    # Present natively on Docker Desktop; declared so Linux and CI resolve it too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Observability — defined in Phase 1, first written to in Phase 4
  # ---------------------------------------------------------------------------
  clickhouse:
    <<: *restart
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: [infra]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    <<: *restart
    image: redis:7.4-alpine
    profiles: [infra]
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:?set REDIS_AUTH in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_AUTH} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      REDIS_AUTH: ${REDIS_AUTH}

  minio:
    <<: *restart
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    profiles: [infra]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  langfuse-worker:
    <<: *restart
    image: langfuse/langfuse-worker:3
    profiles: [infra]
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://:${REDIS_AUTH}@redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      # langfuse-web owns the Prisma migrations. Without this the worker races
      # ahead and crash-loops on tables that do not exist yet.
      langfuse-web: { condition: service_healthy }
    healthcheck:
      # Docker sets HOSTNAME to the container id, and Langfuse's Next.js server
      # binds to that rather than to every interface — so loopback is refused
      # inside the container even while the port answers from outside. Probe the
      # address it actually listens on.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname -i):3030/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  langfuse-web:
    <<: *restart
    image: langfuse/langfuse:3
    profiles: [infra]
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      # Seeds an org, project, and the API keys named in .env, so tracing works
      # on a clean clone with no click-through setup.
      LANGFUSE_INIT_ORG_ID: rfp-workflow
      LANGFUSE_INIT_PROJECT_ID: rfp-workflow
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-dev@rfp-workflow.local}
      LANGFUSE_INIT_USER_NAME: dev
      # A default rather than a `:?` guard on purpose: a required-variable guard
      # makes `docker compose down` fail too, which leaves no way to tear the
      # stack down after an .env change. This value only seeds a local UI login.
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-dev-langfuse-ui-login}
    ports:
      - "${LANGFUSE_PORT_HOST:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      # See the note on langfuse-worker: probe the interface Next.js binds to.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname -i):3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Application
  # Phase 1 ships write-api. run-api, mcp-server and worker join in the phases
  # that build them, so `make up` never waits on a container that cannot start.
  # ---------------------------------------------------------------------------
  write-api:
    <<: *restart
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: rfp-workflow/write-api:0.1.0
    profiles: [app]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-rfp}
      RFP_MIGRATOR_PASSWORD: ${RFP_MIGRATOR_PASSWORD}
      APP_WRITER_PASSWORD: ${APP_WRITER_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-rfp}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/rfp}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-rfp-api}
      GIT_SHA: ${GIT_SHA:-local-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${WRITE_API_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  neo4j-data:
  clickhouse-data:
  redis-data:
  minio-data:
